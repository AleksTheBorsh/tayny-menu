<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тайны Камчатки — админка меню</title>
<style>
  :root{--bg:#f3ede2;--paper:#fff;--ink:#20272b;--soft:#5d6b74;--faint:#9aa4ab;--line:#e3dccd;--gold:#b8945f;--gold-d:#9c7a46;--sea:#2f5d50;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;}
  .wrap{max-width:860px;margin:0 auto;padding:clamp(14px,3vw,28px);}
  .top{position:sticky;top:0;z-index:10;background:rgba(243,237,226,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .top .wrap{display:flex;align-items:center;gap:12px;}
  h1{font-family:Georgia,serif;font-size:20px;margin:0;font-weight:600;}
  .sp{flex:1;}
  .btn{font:inherit;font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid var(--sea);background:var(--sea);color:#fff;border-radius:9px;padding:9px 16px;transition:.15s;}
  .btn:hover{opacity:.9;}.btn:disabled{opacity:.5;cursor:default;}
  .btn.g{border-color:var(--gold);background:var(--gold);}
  .btn.o{background:transparent;color:var(--sea);}
  .login{max-width:340px;margin:16vh auto;text-align:center;}
  .login input{font:inherit;font-size:16px;width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;margin-top:10px;}
  .hint{color:var(--soft);font-size:13px;margin:16px 0 6px;}
  .sec{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;}
  .sec>.h{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#faf6ee;border-bottom:1px solid var(--line);}
  .sec>.h b{font-size:17px;}
  .cat{border-bottom:1px dashed var(--line);}
  .cat>.h{display:flex;align-items:center;gap:8px;padding:11px 14px 11px 16px;cursor:pointer;}
  .cat>.h .nm{flex:1;font-weight:600;}
  .cat>.h .n{color:var(--faint);font-size:12px;}
  .arr{display:inline-flex;gap:4px;}
  .mv{font:inherit;font-size:14px;line-height:1;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;width:30px;height:30px;}
  .mv:disabled{opacity:.3;cursor:default;}
  .dishes{padding:4px 14px 12px 30px;display:none;}
  .cat.open .dishes{display:block;}
  .drow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f0ead d;border-bottom:1px solid #f1ece1;}
  .drow .nm{flex:1;font-size:14px;}
  .drow .pr{color:var(--faint);font-size:13px;white-space:nowrap;}
  .caret{color:var(--faint);width:14px;}
  .bar{position:sticky;bottom:0;background:rgba(243,237,226,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px clamp(14px,3vw,28px);display:flex;gap:10px;align-items:center;}
  .dirty{color:var(--gold-d);font-weight:700;font-size:13px;}
  .toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;}
  .toast.show{opacity:1;}
  .hidden{display:none!important;}
</style>
</head>
<body>

<div id="login" class="login">
  <h1 style="font-size:26px">Админка меню</h1>
  <div class="hint">Тайны Камчатки</div>
  <input id="pw" type="password" placeholder="Пароль" onkeydown="if(event.key==='Enter')doLogin()">
  <div style="margin-top:12px"><button class="btn" style="width:100%" onclick="doLogin()">Войти</button></div>
  <div id="err" style="color:#b4472e;font-size:13px;margin-top:10px;min-height:16px"></div>
</div>

<div id="app" class="hidden">
  <div class="top"><div class="wrap">
    <h1>Меню — порядок</h1><span class="sp"></span>
    <button class="btn g" id="refresh" onclick="refresh()">Обновить из R_Keeper</button>
    <button class="btn" id="publish" onclick="publish()">Выгрузить на сайт</button>
    <a class="btn o" href="/" target="_blank" style="text-decoration:none">Витрина</a>
  </div></div>
  <div class="wrap">
    <p class="hint">Перетаскивать не нужно — порядок меняется стрелками ↑ ↓. Нажмите на папку, чтобы раскрыть блюда. Не забудьте «Сохранить».</p>
    <div id="tree"></div>
  </div>
  <div class="bar">
    <button class="btn" id="save" onclick="save()">Сохранить порядок</button>
    <span class="dirty hidden" id="dirty">есть несохранённые изменения</span>
    <span class="sp"></span>
    <span class="hint" id="meta" style="margin:0"></span>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const SEP='\u0001';
let PW='', MODEL=[], dirty=false;
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function toast(t,ms=2600){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),ms);}
function setDirty(v){dirty=v;$('dirty').classList.toggle('hidden',!v);}
function hdr(){return {'X-Admin-Pw':PW};}

async function doLogin(){
  PW=$('pw').value.trim(); $('err').textContent='';
  const r=await fetch('/api/order',{headers:hdr()});
  if(r.status===401){$('err').textContent='Неверный пароль';PW='';return;}
  try{localStorage.setItem('tk_pw',PW);}catch(e){}
  $('login').classList.add('hidden');$('app').classList.remove('hidden');
  await loadTree();
}

async function loadTree(){
  const d=await (await fetch('menu.json?t='+Date.now())).json();
  $('meta').textContent=`${d.total||0} блюд · обновлено ${d.generated||'—'}`;
  MODEL=(d.groups||[]).map(g=>({title:g.title,cats:g.categories.map(c=>({title:c.title,open:false,
    items:c.items.map(it=>({id:it.id,name:it.name,price:it.price,weight:it.weight}))}))}));
  render(); setDirty(false);
}

function render(){
  let h='';
  MODEL.forEach((g,gi)=>{
    h+=`<div class="sec"><div class="h"><b>${esc(g.title)}</b><span class="sp"></span><span class="n" style="color:var(--faint);font-size:12px">${g.cats.reduce((a,c)=>a+c.items.length,0)} блюд · ${g.cats.length} папок</span></div>`;
    g.cats.forEach((c,ci)=>{
      h+=`<div class="cat${c.open?' open':''}">
        <div class="h" onclick="tog(${gi},${ci},event)">
          <span class="caret">${c.open?'▾':'▸'}</span><span class="nm">${esc(c.title)}</span><span class="n">${c.items.length}</span>
          <span class="arr">
            <button class="mv" ${ci===0?'disabled':''} onclick="moveCat(${gi},${ci},-1,event)">↑</button>
            <button class="mv" ${ci===g.cats.length-1?'disabled':''} onclick="moveCat(${gi},${ci},1,event)">↓</button>
          </span></div>
        <div class="dishes">`;
      c.items.forEach((it,ii)=>{
        h+=`<div class="drow"><span class="arr">
            <button class="mv" ${ii===0?'disabled':''} onclick="moveDish(${gi},${ci},${ii},-1,event)">↑</button>
            <button class="mv" ${ii===c.items.length-1?'disabled':''} onclick="moveDish(${gi},${ci},${ii},1,event)">↓</button>
          </span><span class="nm">${esc(it.name)}</span><span class="pr">${it.price!=null?it.price+' ₽':''}</span></div>`;
      });
      h+='</div></div>';
    });
    h+='</div>';
  });
  $('tree').innerHTML=h;
}
function tog(gi,ci,e){e&&e.stopPropagation();MODEL[gi].cats[ci].open=!MODEL[gi].cats[ci].open;render();}
function moveCat(gi,ci,d,e){e.stopPropagation();const a=MODEL[gi].cats,j=ci+d;if(j<0||j>=a.length)return;[a[ci],a[j]]=[a[j],a[ci]];setDirty(true);render();}
function moveDish(gi,ci,ii,d,e){e.stopPropagation();const a=MODEL[gi].cats[ci].items,j=ii+d;if(j<0||j>=a.length)return;[a[ii],a[j]]=[a[j],a[ii]];setDirty(true);render();}

async function save(){
  const order={sections:MODEL.map(g=>g.title),folders:{},dishes:{}};
  for(const g of MODEL){order.folders[g.title]=g.cats.map(c=>c.title);
    for(const c of g.cats)order.dishes[g.title+SEP+c.title]=c.items.map(i=>i.id);}
  const r=await fetch('/api/order',{method:'POST',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(order)});
  if(r.ok){setDirty(false);toast('Порядок сохранён');}else toast('Ошибка сохранения');
}

async function refresh(){
  if(dirty&&!confirm('Есть несохранённые изменения порядка — они сбросятся свежими данными. Продолжить?'))return;
  const b=$('refresh');b.disabled=true;const o=b.textContent;b.textContent='Обновляю…';toast('Тяну меню из R_Keeper…',9000);
  try{const j=await (await fetch('/api/refresh',{method:'POST',headers:hdr()})).json();
    if(j.ok){await loadTree();toast('Обновлено · '+j.total+' блюд');}else toast('Ошибка: '+(j.error||''));}
  catch(e){toast('Не удалось обновить');}
  b.disabled=false;b.textContent=o;
}

async function publish(){
  if(dirty&&!confirm('Есть несохранённые изменения порядка. Выгрузить текущее сохранённое меню? (новый порядок попадёт на сайт только после «Сохранить»)'))return;
  const b=$('publish');b.disabled=true;const o=b.textContent;b.textContent='Выгружаю…';toast('Публикую меню на сайт…',9000);
  try{const j=await (await fetch('/api/publish',{method:'POST',headers:hdr()})).json();
    if(j.ok)toast(j.changed===false?'На сайте уже актуально — изменений нет':('Опубликовано на сайте · '+(j.total||0)+' блюд · обновится на Tilda за ~1 мин'),5000);
    else toast('Ошибка публикации: '+(j.error||''),7000);}
  catch(e){toast('Не удалось опубликовать');}
  b.disabled=false;b.textContent=o;
}

(function(){try{const s=localStorage.getItem('tk_pw');if(s){$('pw').value=s;}}catch(e){}})();
</script>
</body>
</html>
